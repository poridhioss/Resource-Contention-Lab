apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-hog-service
  namespace: contention-lab
  labels:
    app: cpu-hog-service
    version: baseline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpu-hog-service
  template:
    metadata:
      labels:
        app: cpu-hog-service
        version: baseline
    spec:
      containers:
        - name: hog
          image: konami98/cpu-hog-service:latest
          # NO resource requests/limits - this will consume all available CPU!
          env:
            - name: INTENSITY
              value: "high"
          command: ["python", "hog.py", "--intensity", "high"]
