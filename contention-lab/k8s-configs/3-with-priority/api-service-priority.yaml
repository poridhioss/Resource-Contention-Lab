apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: contention-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
        version: priority
    spec:
      priorityClassName: high-priority-api  # High priority scheduling
      containers:
        - name: api
          image: konami98/api-service:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "300m"
              memory: "128Mi"
            limits:
              cpu: "800m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-service-nodeport
  namespace: contention-lab
spec:
  selector:
    app: api-service
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: 8000
      nodePort: 30080